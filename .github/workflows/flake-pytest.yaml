name: Python lint and test

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sourcefiles/tests/requirements.txt
      - name: Lint with flake8
        run: |
          flake8 . --show-source --statistics -v
      - name: Test with pytest
        env:
          # The runner has no display; Qt needs a platform plugin either way.
          QT_QPA_PLATFORM: offscreen
        run: |
          cd sourcefiles
          pytest --cov
